<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>질문에 맞춰 화면을 전환합니다</title><style>
*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#F7FAF8;color:#102731;font-family:Arial,sans-serif}.top{height:26px;background:#116B5E}.wrap{padding:104px 130px}h1{margin:0;font-size:82px;line-height:1.1;letter-spacing:-2px}p{margin:28px 0 0;font-size:40px;line-height:1.4;color:#35535A}.panel{margin-top:100px;height:420px;padding:92px;border-radius:34px;background:#102731;color:#F7FAF8}.label{margin:0;color:#BFD8D1;font-size:38px}.message{margin:38px 0 0;font-size:70px;line-height:1.15;font-weight:700}.detail{font-size:40px;color:#BFD8D1}.controls{display:flex;align-items:center;gap:60px;margin-top:80px}button{border:0;border-radius:60px;background:#A84A1A;color:#F7FAF8;font:700 38px Arial,sans-serif;padding:36px 58px;cursor:pointer}button:focus-visible{outline:8px solid #116B5E;outline-offset:7px}.state{font-size:38px;color:#116B5E}
</style></head><body><div class="top"></div><main class="wrap"><h1>질문에 맞춰 화면을 전환합니다</h1><p>버튼 하나로 설명의 초점을 바꿔 보는 간단한 예시입니다.</p><section class="panel" aria-live="polite"><p class="label" id="label">현재 보기</p><div class="message" id="message">전체 구조를 먼저 살펴봅니다</div><p class="detail" id="detail">그룹, 미디어, 경로가 연결되는 방식을 확인합니다.</p></section><div class="controls"><button id="toggle" type="button">질문 중심 보기</button><span class="state" id="state">상호작용 HTML 슬라이드</span></div></main><script>const b=document.getElementById('toggle'),m=document.getElementById('message'),d=document.getElementById('detail'),l=document.getElementById('label'),s=document.getElementById('state');let question=false;b.addEventListener('click',()=>{question=!question;l.textContent=question?'질문 중심 보기':'현재 보기';m.textContent=question?'궁금한 장면부터 살펴봅니다':'전체 구조를 먼저 살펴봅니다';d.textContent=question?'관련된 그룹과 슬라이드로 바로 이동할 수 있습니다.':'그룹, 미디어, 경로가 연결되는 방식을 확인합니다.';b.textContent=question?'전체 구조 보기':'질문 중심 보기';s.textContent=question?'질문에 맞춘 설명 상태':'상호작용 HTML 슬라이드'})</script></body></html>
