<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
 <title id="title">그룹마다 읽는 방식이 다릅니다</title><desc id="desc">행, 격자, 트리 모양의 세 가지 슬라이드 배치를 비교하는 화면</desc><rect width="1920" height="1080" fill="#F7FAF8"/>
 <text x="130" y="154" fill="#102731" font-family="Arial, sans-serif" font-size="82" font-weight="700">그룹마다 읽는 방식이 다릅니다</text><text x="130" y="225" fill="#35535A" font-family="Arial, sans-serif" font-size="40">같은 자료도 관계에 따라 다른 구조로 보여 줄 수 있습니다.</text>
 <rect x="130" y="350" width="500" height="490" rx="28" fill="#E0EEE9"/><text x="175" y="432" fill="#116B5E" font-family="Arial, sans-serif" font-size="48" font-weight="700">행</text><rect x="175" y="505" width="120" height="160" rx="14" fill="#116B5E"/><rect x="325" y="505" width="120" height="160" rx="14" fill="#A84A1A"/><rect x="475" y="505" width="110" height="160" rx="14" fill="#102731"/><text x="175" y="757" fill="#35535A" font-family="Arial, sans-serif" font-size="36">순서가 중요한 흐름</text>
 <rect x="710" y="350" width="500" height="490" rx="28" fill="#FFF0E8"/><text x="755" y="432" fill="#A84A1A" font-family="Arial, sans-serif" font-size="48" font-weight="700">격자</text><rect x="755" y="500" width="170" height="100" rx="14" fill="#116B5E"/><rect x="955" y="500" width="170" height="100" rx="14" fill="#102731"/><rect x="755" y="630" width="170" height="100" rx="14" fill="#102731"/><rect x="955" y="630" width="170" height="100" rx="14" fill="#A84A1A"/><text x="755" y="797" fill="#35535A" font-family="Arial, sans-serif" font-size="36">비교가 필요한 묶음</text>
 <rect x="1290" y="350" width="500" height="490" rx="28" fill="#102731"/><text x="1335" y="432" fill="#F7FAF8" font-family="Arial, sans-serif" font-size="48" font-weight="700">트리</text><path d="M1540 525 V595 M1410 650 H1670 M1410 650 V705 M1670 650 V705" stroke="#8DB9AF" stroke-width="10"/><rect x="1470" y="490" width="140" height="70" rx="14" fill="#A84A1A"/><rect x="1340" y="705" width="140" height="70" rx="14" fill="#116B5E"/><rect x="1600" y="705" width="140" height="70" rx="14" fill="#116B5E"/><text x="1335" y="815" fill="#BFD8D1" font-family="Arial, sans-serif" font-size="36">원인과 갈래의 관계</text>
 <text x="130" y="970" fill="#116B5E" font-family="Arial, sans-serif" font-size="46" font-weight="700">레이아웃은 내용의 관계를 드러내는 선택입니다.</text>
</svg>
